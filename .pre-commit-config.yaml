exclude: ^(?:archive|outputs)/
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --quiet ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-check
        name: ruff check
        entry: uv run --quiet ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ty
        name: ty check
        entry: uv run --quiet ty check --python-version 3.14 --error-on-warning hal experiments/059_muon_action_sequence.py scripts
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
