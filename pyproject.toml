[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hal"
version = "0.1.0"
description = "Decoder-only Transformer trained on Super Smash Bros. Melee replays"
readme = "README.md"
# The codebase uses current Python syntax and toolchain support.
requires-python = ">=3.14"
dependencies = [
    "beartype>=0.22.9",
    "boto3",
    "fsspec",
    "httpx",
    "jaxtyping>=0.3.9",
    "loguru",
    "melee",
    "modal>=1.5.3",
    "mosaicml-streaming==0.13.0",
    "numpy",
    "peppi-py",
    "prometheus-client",
    "py7zr==1.1.0",
    "pyarrow>=22",
    "s3fs>=2025",
    "scipy>=1.17.1",
    "torch==2.11.0",
    "tqdm",
    "tyro",
    "vastai>=1.0.13",
    "wandb",
    "websockets",
]

[project.scripts]
fetch = "hal.scripts.fetch:main"
hal-play = "hal.scripts.policy:play_main"
hal-policy = "hal.scripts.policy:main"
hal-netplay-admin = "hal.netplay_service.admin:main"
hal-netplay-runner = "hal.netplay_service.runner:main"
slp-link = "hal.scripts.slp_link:main"
slippi-jwt = "hal.scripts.slippi_jwt:main"

[dependency-groups]
analysis = [
    "ipykernel",
    "matplotlib",
    "pandas",
]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
    "ty",
]

[tool.uv]
python-preference = "only-managed"

[tool.uv.sources]
melee = { path = "vendor/melee-0.47.0+hal.realtime.1.tar.gz" }
peppi-py = { git = "https://github.com/ericyuegu/peppi-py", rev = "6fca8045d891961c8c9a40ff21ea40bcf5367e0e" }

[tool.setuptools.packages.find]
include = ["hal*"]

[tool.ruff]
line-length = 119
target-version = "py314"
extend-exclude = [
    ".venv",
    "archive",
    "build",
    "outputs",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/039_scaling_viz.py" = ["B007", "B905"]
# Ruff parses jaxtyping dimension strings as forward-reference type expressions.
"experiments/059_muon_action_sequence.py" = ["F722"]
"hal/models/attention.py" = ["F722"]

[tool.pytest.ini_options]
# Without this a bare `pytest` walks runs/, wandb/ and data/ and dies on the
# first unreadable artifact.
testpaths = ["tests"]
markers = [
    "integration: tests that launch external services or emulators",
]

[tool.ruff.lint.isort]
known-first-party = ["hal"]
known-third-party = ["docker", "libmelee", "slippi-Ishiiruka", "wandb"]
force-single-line = true

[tool.ty.environment]
root = ["."]

[tool.ty.src]
exclude = [
    "notebooks/**",
]
