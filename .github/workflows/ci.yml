name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen --all-groups --extra netplay-server
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - name: Type check maintained code
        run: |
          uv run ty check --python-version 3.14 --error-on-warning \
            hal \
            experiments/059_muon_action_sequence.py \
            scripts
      - run: uv run pytest -q -m "not integration"
