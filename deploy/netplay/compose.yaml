name: hal-netplay

services:
  runner:
    image: hal-netplay-runner:${HAL_GIT_SHA:?set HAL_GIT_SHA}
    build:
      context: ../..
      dockerfile: deploy/netplay/Dockerfile
      args:
        HAL_GIT_SHA: ${HAL_GIT_SHA:?set HAL_GIT_SHA}
    restart: unless-stopped
    runtime: nvidia
    command: ["hal-netplay-runner", "--slots", "${HAL_NETPLAY_SLOTS:-1}", "--compiled", "--git-sha", "${HAL_GIT_SHA}"]
    environment:
      HAL_NETPLAY_API_URL: ${HAL_NETPLAY_API_URL:?set HAL_NETPLAY_API_URL}
      HAL_NETPLAY_RUNNER_TOKEN: ${HAL_NETPLAY_RUNNER_TOKEN:?set HAL_NETPLAY_RUNNER_TOKEN}
      CF_ACCESS_CLIENT_ID: ${CF_ACCESS_CLIENT_ID:?set CF_ACCESS_CLIENT_ID}
      CF_ACCESS_CLIENT_SECRET: ${CF_ACCESS_CLIENT_SECRET:?set CF_ACCESS_CLIENT_SECRET}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:?set AWS_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY}
      AWS_BUCKET: ${AWS_BUCKET:-hal}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,graphics,utility,video,display
      HAL_NETPLAY_STREAM_DISPLAY: ${HAL_NETPLAY_STREAM_DISPLAY:?set a dedicated NVIDIA Xorg display}
      XAUTHORITY: /run/hal-netplay/Xauthority
    volumes:
      - cache:/root/.cache/hal-netplay
      - state:/opt/hal/runs/netplay
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${HAL_NETPLAY_XAUTHORITY:?set the Xorg cookie file}:/run/hal-netplay/Xauthority:ro
    shm_size: 1gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  cache:
  state:
