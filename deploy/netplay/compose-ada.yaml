# Use only after two-session Ada timing and soak qualification passes.
services:
  api:
    environment:
      HAL_NETPLAY_CAPACITY: "2"

  runner:
    command:
      - hal-netplay-runner
      - /run/hal-policy/policy.halpolicy
      - --compiled
      - --database
      - /var/lib/hal-netplay/queue.sqlite3
      - --user-jsons
      - /run/hal-secrets/slippi-user-a.json,/run/hal-secrets/slippi-user-b.json
      - --slippi-ports
      - "51441,51442"
      - --iso-path
      - /run/hal-assets/ssbm.ciso
      - --dolphin-path
      - /run/hal-assets/Slippi_Online-x86_64.AppImage
      - --replay-dir
      - /var/lib/hal-netplay/replays
      - --git-sha
      - ${HAL_GIT_SHA}
    volumes:
      - ${HAL_NETPLAY_USER_JSON_B:?set HAL_NETPLAY_USER_JSON_B}:/run/hal-secrets/slippi-user-b.json:ro
