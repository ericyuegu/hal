<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">How one frame becomes one observation token</title>
  <desc id="desc">Four player feature blocks, past controller input, character and stage embeddings, and a pooled four-slot projectile set are concatenated and projected. An ego identity projection is then added.</desc>
  <style>
    .bg { fill: #fbfaf7; }
    .box { fill: #fff; stroke: #d7d2ca; stroke-width: 1.5; }
    .player { fill: #eef4f8; stroke: #9cb6ca; stroke-width: 1.5; }
    .item { fill: #f7eee8; stroke: #ce9a79; stroke-width: 1.5; }
    .action { fill: #eef2e8; stroke: #9caf82; stroke-width: 1.5; }
    .hot { fill: #315f8c; stroke: #274d72; stroke-width: 1.5; }
    .identity { fill: #f4edf6; stroke: #aa88b1; stroke-width: 1.5; }
    .line { fill: none; stroke: #756f68; stroke-width: 1.7; marker-end: url(#arrow); }
    .line-soft { fill: none; stroke: #a39d95; stroke-width: 1.3; marker-end: url(#arrow-soft); }
    .ink { fill: #22201e; font-family: Inter, Arial, sans-serif; }
    .white { fill: #fff; font-family: Inter, Arial, sans-serif; }
    .muted { fill: #6f6962; font-family: Inter, Arial, sans-serif; }
    .mono { fill: #22201e; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .h1 { font-size: 30px; font-weight: 700; }
    .h2 { font-size: 18px; font-weight: 700; }
    .label { font-size: 15px; font-weight: 650; }
    .small { font-size: 12.5px; }
    .tiny { font-size: 11px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#756f68"/></marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a39d95"/></marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="ink h1" x="44" y="52">Observation Inputs</text>
  <text class="muted small" x="44" y="78">One game frame becomes one trunk token. The same feature path is used in training and live play.</text>

  <text class="ink h2" x="44" y="120">Player state</text>
  <rect class="player" x="44" y="138" width="205" height="108" rx="8"/>
  <text class="ink label" x="60" y="164">Ego</text>
  <text class="muted small" x="60" y="187">6 continuous values + masks</text>
  <text class="muted small" x="60" y="208">action, stock, jumps,</text>
  <text class="muted small" x="60" y="226">hurtbox, airborne embeddings</text>

  <rect class="player" x="264" y="138" width="205" height="108" rx="8"/>
  <text class="ink label" x="280" y="164">Ego follower</text>
  <text class="muted small" x="280" y="187">Same feature layout</text>
  <text class="muted small" x="280" y="208">Missing Ice Climbers follower</text>
  <text class="muted small" x="280" y="226">is represented by masks</text>

  <rect class="player" x="484" y="138" width="205" height="108" rx="8"/>
  <text class="ink label" x="500" y="164">Opponent follower</text>
  <text class="muted small" x="500" y="187">Same feature layout</text>
  <text class="muted small" x="500" y="208">Missing Ice Climbers follower</text>
  <text class="muted small" x="500" y="226">is represented by masks</text>

  <rect class="player" x="704" y="138" width="205" height="108" rx="8"/>
  <text class="ink label" x="720" y="164">Opponent</text>
  <text class="muted small" x="720" y="187">6 continuous values + masks</text>
  <text class="muted small" x="720" y="208">action, stock, jumps,</text>
  <text class="muted small" x="720" y="226">hurtbox, airborne embeddings</text>

  <text class="ink h2" x="44" y="298">Other frame inputs</text>
  <rect class="action" x="44" y="316" width="270" height="86" rx="8"/>
  <text class="ink label" x="60" y="342">Past controller action</text>
  <text class="muted small" x="60" y="365">class embedding + semantic projection</text>
  <text class="muted small" x="60" y="384">four controller groups concatenated</text>

  <rect class="box" x="330" y="316" width="220" height="86" rx="8"/>
  <text class="ink label" x="346" y="342">Match identity</text>
  <text class="muted small" x="346" y="365">ego + opponent character</text>
  <text class="muted small" x="346" y="384">stage</text>

  <text class="ink h2" x="44" y="456">Projectile set</text>
  <g>
    <rect class="item" x="44" y="474" width="155" height="78" rx="8"/>
    <rect class="item" x="211" y="474" width="155" height="78" rx="8"/>
    <rect class="item" x="378" y="474" width="155" height="78" rx="8"/>
    <rect class="item" x="545" y="474" width="155" height="78" rx="8"/>
    <text class="ink label" x="121" y="500" text-anchor="middle">Slot 0</text>
    <text class="ink label" x="288" y="500" text-anchor="middle">Slot 1</text>
    <text class="ink label" x="455" y="500" text-anchor="middle">Slot 2</text>
    <text class="ink label" x="622" y="500" text-anchor="middle">Slot 3</text>
    <text class="muted tiny" x="121" y="523" text-anchor="middle">type · state · x/y</text>
    <text class="muted tiny" x="288" y="523" text-anchor="middle">type · state · x/y</text>
    <text class="muted tiny" x="455" y="523" text-anchor="middle">type · state · x/y</text>
    <text class="muted tiny" x="622" y="523" text-anchor="middle">type · state · x/y</text>
    <text class="muted tiny" x="121" y="540" text-anchor="middle">velocity · masks</text>
    <text class="muted tiny" x="288" y="540" text-anchor="middle">velocity · masks</text>
    <text class="muted tiny" x="455" y="540" text-anchor="middle">velocity · masks</text>
    <text class="muted tiny" x="622" y="540" text-anchor="middle">velocity · masks</text>
  </g>
  <path class="line-soft" d="M121 552 C121 582 208 574 260 596"/>
  <path class="line-soft" d="M288 552 C288 570 298 577 316 596"/>
  <path class="line-soft" d="M455 552 C455 570 400 577 372 596"/>
  <path class="line-soft" d="M622 552 C622 582 488 574 428 596"/>
  <rect class="item" x="250" y="596" width="200" height="66" rx="8"/>
  <text class="ink label" x="350" y="621" text-anchor="middle">Shared slot encoder</text>
  <text class="muted small" x="350" y="643" text-anchor="middle">presence gate · sum</text>

  <path class="line-soft" d="M147 246 L147 272"/>
  <path class="line-soft" d="M367 246 L367 272"/>
  <path class="line-soft" d="M587 246 L587 272"/>
  <path class="line-soft" d="M807 246 L807 272"/>
  <path class="line" d="M147 272 L970 272 L970 322"/>
  <path class="line" d="M179 402 L179 428 L920 428 L944 406"/>
  <path class="line" d="M440 402 L440 428 L920 428"/>
  <path class="line" d="M450 629 L724 629 L724 450 L936 399"/>

  <rect class="hot" x="930" y="326" width="226" height="94" rx="10"/>
  <text class="white label" x="1043" y="356" text-anchor="middle">Concatenate all parts</text>
  <text class="white small" x="1043" y="380" text-anchor="middle">one linear projection</text>
  <text class="white small" x="1043" y="402" text-anchor="middle">observation token</text>

  <rect class="identity" x="760" y="494" width="244" height="78" rx="8"/>
  <text class="ink label" x="882" y="521" text-anchor="middle">Ego-player identity</text>
  <text class="muted small" x="882" y="544" text-anchor="middle">embedding to bias-free projection</text>
  <path class="line" d="M1004 533 C1098 533 1098 448 1074 420"/>
  <text class="mono" x="1083" y="476">+</text>

  <rect class="box" x="760" y="606" width="396" height="82" rx="8"/>
  <text class="ink label" x="780" y="632">Measured projectile effect</text>
  <text class="mono" x="780" y="657">+0.092 stocks/min · +10.5 damage/min</text>
  <text class="muted tiny" x="780" y="677">Follower-field ablation: not run</text>
</svg>
