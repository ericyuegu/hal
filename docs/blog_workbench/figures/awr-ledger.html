<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hillclimbing Melee</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ericyuegu.com design system — "Quiet Notebook": warm paper, cool ink, oxblood.
   Tokens copied from the design system; ink mode is the paper metaphor inverted. */
@font-face{font-family:Charter;font-style:normal;font-weight:400;font-display:swap;src:local("Charter"),url("fonts/charter_regular.woff2") format("woff2")}
@font-face{font-family:Charter;font-style:italic;font-weight:400;font-display:swap;src:local("Charter Italic"),local("Charter-Italic"),url("fonts/charter_italic.woff2") format("woff2")}
@font-face{font-family:Charter;font-style:normal;font-weight:700;font-display:swap;src:local("Charter Bold"),local("Charter-Bold"),url("fonts/charter_bold.woff2") format("woff2")}
@font-face{font-family:Charter;font-style:italic;font-weight:700;font-display:swap;src:local("Charter Bold Italic"),local("Charter-BoldItalic"),url("fonts/charter_bold_italic.woff2") format("woff2")}

:root{
  color-scheme:light;
  --paper:#FBFAF6; --paper-warm:#F4F1E8;
  --ink:#1C2530; --ink-soft:#5F5B50; --ink-faint:#8C8779; --ink-ghost:#A8A294; --ink-mono:#6E6A5E;
  --oxblood:#7B2E2E; --sage:#4F6C58; --white:#FFFFFF;
  --rule:#EDE9DD; --rule-dotted:#CFC8B6; --rule-underline:#D8D2C2; --frame-border:#1C2530; --aside-border:#E2DCCB;
  --surface-page:var(--paper); --surface-card:var(--white); --surface-aside:#F5F2E8; --surface-inverse:var(--ink);
  --text-body:var(--ink); --text-mono:var(--ink-mono); --text-inverse:var(--paper);
  --accent:var(--oxblood); --link:var(--accent);
  --selection:color-mix(in srgb,var(--accent) 18%,transparent);
  --code-bg:rgba(28,37,48,.05);
  --shadow-ink-10:rgba(28,37,48,.10); --shadow-ink-12:rgba(28,37,48,.12); --shadow-ink-14:rgba(28,37,48,.14); --shadow-ink-18:rgba(28,37,48,.18);
  --shadow:var(--shadow-ink-12); --shadow-soft:var(--shadow-ink-10);

  --font-serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --serif:var(--font-serif); --mono:var(--font-mono);

  --fs-body:17px; --lh-body:1.6;
  --mono-marker-size:.78rem; --mono-marker-ls:.10em; --mono-marker-weight:600;
  --mono-meta-size:.72rem; --mono-meta-ls:.02em; --mono-meta-weight:400;
  --mono-ghost-size:.70rem; --mono-ghost-ls:.03em; --mono-ghost-weight:400;

  --col-max:680px; --measure:640px; --col-pad:24px; --breakout:920px; --cols-breakout:920px;
  --space-section:2.7rem; --space-fig:2.3rem; --space-para:.9em;

  --radius:0;
  --border-hair:1px solid var(--rule); --border-frame:1px solid var(--frame-border); --border-dotted:1px dotted var(--rule-dotted); --border-heavy:2px solid var(--ink);
  --frame-pad:12px; --frame-pad-tight:4px;
  --shadow-frame-sm:2px 2px 0 var(--shadow-ink-10); --shadow-frame:3px 3px 0 var(--shadow-ink-12); --shadow-frame-lg:5px 5px 0 var(--shadow-ink-14); --shadow-frame-hover:4px 4px 0 var(--shadow-ink-18);
  --focus-color:var(--text-body); --focus-outline:2px solid var(--focus-color); --focus-offset:2px;

  --ease:ease; --dur-fast:.14s; --dur-mid:.18s; --dur-view:.22s; --dur-flash:.3s; --flash-hold:1500ms;
  --lift:translate(-1px,-1px);
}

/* ink mode tokens — one block, applied under every dark stamp */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#151B22; --paper-warm:#1D242C;
    --ink:#E9E5DB; --ink-soft:#B4AEA1; --ink-faint:#8A857A; --ink-ghost:#6E6A61; --ink-mono:#9A9488;
    --oxblood:#C86F63; --sage:#7FA189; --white:#1E262F;
    --rule:#262E38; --rule-dotted:#3A434E; --rule-underline:#3F4852; --frame-border:#57626D; --aside-border:#2E3742;
    --surface-aside:#212A33; --surface-inverse:#E9E5DB; --text-inverse:#151B22;
    --code-bg:rgba(233,229,219,.07);
    --shadow-ink-10:rgba(0,0,0,.45); --shadow-ink-12:rgba(0,0,0,.52); --shadow-ink-14:rgba(0,0,0,.58); --shadow-ink-18:rgba(0,0,0,.68);
  }
}
:root[data-theme="dark"],:root[data-theme="ink"]{
  color-scheme:dark;
  --paper:#151B22; --paper-warm:#1D242C;
  --ink:#E9E5DB; --ink-soft:#B4AEA1; --ink-faint:#8A857A; --ink-ghost:#6E6A61; --ink-mono:#9A9488;
  --oxblood:#C86F63; --sage:#7FA189; --white:#1E262F;
  --rule:#262E38; --rule-dotted:#3A434E; --rule-underline:#3F4852; --frame-border:#57626D; --aside-border:#2E3742;
  --surface-aside:#212A33; --surface-inverse:#E9E5DB; --text-inverse:#151B22;
  --code-bg:rgba(233,229,219,.07);
  --shadow-ink-10:rgba(0,0,0,.45); --shadow-ink-12:rgba(0,0,0,.52); --shadow-ink-14:rgba(0,0,0,.58); --shadow-ink-18:rgba(0,0,0,.68);
}

</style>
<style>

    *{box-sizing:border-box}
    a{color:var(--oxblood);text-decoration:none}
    a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
    a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
    ::selection{background:rgba(123,46,46,.18)}
    button,input,select{font:inherit}
    button{border-radius:0}
    article{padding:0}
    h1{font-size:clamp(2.25rem,7vw,3.6rem);line-height:1.04;letter-spacing:-.025em;font-weight:700;margin:.55rem 0 .8rem;text-wrap:balance}
    h2{font:600 .8rem/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;margin:4rem 0 1.25rem;padding-bottom:7px;border-bottom:2px solid var(--ink)}
    h2 .section-number{float:right;color:var(--ink-faint);font-weight:400}
    h3{font-size:1.28rem;line-height:1.28;margin:2.75rem 0 .7rem}
    h4{font-size:1.03rem;line-height:1.35;margin:2rem 0 .5rem}
    p{margin:0 0 .9em;text-wrap:pretty}
    ul,ol{padding-left:1.35rem;margin:.7rem 0 1.1rem}
    li{margin:.42rem 0}
    li>ul{margin-top:.35rem}
    code,.mono{font-family:var(--mono);font-size:.82em;font-variant-numeric:tabular-nums}
    .kicker,.meta,.caption,.control-label,.eyebrow,.ghost,.source-line,.stat-label,.tab-note,.table-meta{font-family:var(--mono);font-variant-numeric:tabular-nums}
    .kicker{font-size:.78rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--oxblood);margin:0}
    .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:.72rem;letter-spacing:.02em;color:var(--ink-mono);padding-bottom:1.6rem;margin-bottom:1.8rem;border-bottom:1px solid var(--rule)}
    .meta a{color:var(--ink-mono);text-decoration:underline;text-decoration-color:var(--rule-underline);text-underline-offset:3px}
    .lede{font-size:1.08rem}
    .breakout{width:min(var(--breakout),calc(100vw - 32px));margin-left:50%;transform:translateX(-50%)}
    figure{margin:2.3rem 0}
    .artifact{background:var(--white);border:1px solid var(--ink);padding:12px;box-shadow:3px 3px 0 var(--shadow)}
    .artifact.interactive{transition:transform .14s ease,box-shadow .14s ease}
    .artifact.interactive:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 rgba(28,37,48,.18)}
    figcaption{font:400 .72rem/1.5 var(--mono);letter-spacing:.02em;color:var(--ink-mono);margin-top:9px}
    .source-toggle{border:0;border-bottom:1px solid var(--rule-underline);padding:0;background:transparent;color:var(--ink-mono);font:inherit;cursor:pointer}
    .source-toggle:hover{color:var(--oxblood);border-color:var(--oxblood)}
    .source-line,.run-source,.run-source-cell{display:none}
    body.show-run-sources .source-line{display:block}
    body.show-run-sources .run-source{display:inline}
    body.show-run-sources .run-source-cell{display:table-cell}
    .figure-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;padding:3px 3px 11px;border-bottom:1px solid var(--rule)}
    .figure-head h4{margin:0;font-size:1.03rem}
    .figure-head p{margin:.18rem 0 0;color:var(--ink-soft);font-size:.9rem}
    .aside{background:var(--surface-aside);border:1px solid var(--aside-border);padding:14px 16px;margin:1.8rem 0}
    .aside p:last-child,.aside ul:last-child{margin-bottom:0}
    .aside-label{font:600 .68rem/1.4 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink);margin:0 0 .55rem}
    .author-note{border-left:2px solid var(--rule-dotted);padding-left:14px;color:var(--ink-soft)}
    .author-note summary{cursor:pointer;font:400 .72rem/1.5 var(--mono);color:var(--ink-mono)}
    .author-note ul{margin:.7rem 0 0}
    .question-list{list-style:none;padding:0;margin:1.6rem 0 2.4rem}
    .question-list>li{border-top:1px dotted var(--rule-dotted);padding:1.05rem 0;margin:0}
    .question-list>li:last-child{border-bottom:1px dotted var(--rule-dotted)}
    .question-list strong{display:block;margin-bottom:.25rem}
    .question-list ul{margin-bottom:0}
    .release-list{display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:0;list-style:none;border:1px solid var(--rule-dotted);margin:1rem 0}
    .release-list li{padding:13px 14px;margin:0;border-right:1px solid var(--rule)}
    .release-list li:last-child{border-right:0}
    .release-list b{display:block;font:600 .7rem/1.35 var(--mono);letter-spacing:.05em;margin-bottom:.3rem}
    .todo{color:var(--ink-faint);font:400 .7rem/1.4 var(--mono)}
    .metrics-strip{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--aside-border);background:var(--surface-aside);margin:1.8rem 0}
    .metrics-strip>div{padding:13px 14px;border-right:1px solid var(--aside-border)}
    .metrics-strip>div:last-child{border-right:0}
    .metrics-strip b{display:block;font:600 .7rem/1.4 var(--mono);margin-bottom:.3rem}
    .metrics-strip span{display:block;font-size:.88rem;line-height:1.45;color:var(--ink-soft)}
    .segmented{display:inline-flex;border:1px solid var(--ink);background:var(--paper);flex-wrap:wrap}
    .segmented button{min-height:38px;padding:7px 13px;border:0;border-right:1px solid var(--ink);background:transparent;color:var(--ink-mono);font:500 .68rem/1.3 var(--mono);letter-spacing:.04em;cursor:pointer}
    .segmented button:last-child{border-right:0}
    .segmented button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
    .segmented button:hover:not([aria-pressed="true"]){background:var(--surface-aside)}
    .controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 3px 1px}
    .control-label{font-size:.7rem;color:var(--ink-mono)}
    .control-plate{background:var(--surface-aside);border:1px solid var(--aside-border);padding:13px 15px;margin-top:12px}
    .slider-row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
    input[type="range"]{width:100%;accent-color:var(--oxblood)}
    select{min-height:38px;border:1px solid var(--ink);border-radius:0;background:var(--paper);color:var(--ink);padding:6px 28px 6px 9px;font:400 .7rem/1.3 var(--mono)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule);margin-top:10px}
    .stat{padding:12px 10px 5px;border-right:1px solid var(--rule)}
    .stat:last-child{border-right:0}
    .stat-value{display:block;font:600 1rem/1.25 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
    .stat-label{display:block;font-size:.64rem;color:var(--ink-faint);margin-top:.2rem}
    .chart{display:block;width:100%;height:auto;overflow:visible}
    .chart text{font-family:var(--mono);font-size:9.5px;fill:var(--ink-mono)}
    .chart .axis-label{font-size:10px;fill:var(--ink-mono)}
    .chart .grid{stroke:var(--rule);stroke-width:1}
    .chart .axis{stroke:var(--rule-dotted);stroke-width:1}
    .chart .zero{stroke:var(--ink-faint);stroke-width:1;stroke-dasharray:3 3}
    .chart .line{fill:none;stroke-width:1.8}
    .chart .point{stroke:var(--white);stroke-width:1.5;cursor:crosshair}
    .chart .point:focus{stroke:var(--ink);stroke-width:2}
    .chart-note{font-size:.86rem;color:var(--ink-soft);line-height:1.45;margin:8px 3px 0}
    .source-line{font-size:.68rem;line-height:1.5;color:var(--ink-mono)}
    .source-line a{color:var(--ink-mono);text-decoration:underline;text-decoration-color:var(--rule-underline);text-underline-offset:3px}
    .candidate-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:8px;font-family:var(--mono)}
    .candidate-head b{font-size:.66rem;line-height:1.35}
    .candidate-head span{font-size:.58rem;line-height:1.35;color:var(--ink-faint);text-align:right}
    .mtp-candidates{padding:1px 4px 3px}
    .mtp-candidate{padding:18px 0 20px;border-bottom:1px dotted var(--rule-dotted)}
    .mtp-candidate:last-child{border-bottom:0;padding-bottom:5px}
    .architecture-figure{padding:15px 3px 3px}
    .architecture-panel+.architecture-panel{margin-top:13px;padding-top:14px;border-top:1px dotted var(--rule-dotted)}
    .model-diagram{display:block;width:100%;height:auto;overflow:visible}
    .model-diagram text{font-family:var(--mono);font-size:10px;fill:var(--ink-mono)}
    .model-diagram .diagram-title{font-size:11px;font-weight:600;fill:var(--ink)}
    .model-diagram .diagram-title.accent{fill:var(--oxblood)}
    .model-diagram .diagram-label{font-size:9px;font-weight:600;fill:var(--ink)}
    .model-diagram .diagram-note{font-size:8px;fill:var(--ink-faint)}
    .model-diagram .model-box{fill:var(--paper);stroke:var(--ink);stroke-width:1}
    .model-diagram .model-layer{fill:var(--surface-aside);stroke:var(--rule-dotted);stroke-width:1}
    .model-diagram .model-token{fill:var(--paper);stroke:var(--rule-dotted);stroke-width:1}
    .model-diagram .model-token.accent,.model-diagram .model-box.accent{fill:rgba(123,46,46,.05);stroke:var(--oxblood)}
    .model-diagram .model-wire{fill:none;stroke:var(--ink-faint);stroke-width:1.1}
    .model-diagram .model-wire.accent{stroke:var(--oxblood);stroke-width:1.35}
    .model-diagram .model-wire.ghost{stroke:var(--rule-dotted)}
    .model-diagram .attention-cell{fill:var(--paper);stroke:var(--rule-dotted);stroke-width:1}
    .model-diagram .attention-cell.on{fill:var(--ink);stroke:var(--ink)}
    .model-diagram .attention-cell.accent{fill:var(--oxblood);stroke:var(--oxblood)}
    .model-diagram [data-module]{transition:opacity .14s ease}
    .model-diagram [data-module].module-dim{opacity:.16}
    .model-diagram [data-module].module-focus{opacity:1}
    .model-diagram [data-module].module-focus .model-box,.model-diagram [data-module].module-focus .model-token,.model-diagram [data-module].module-focus .model-layer{stroke:var(--oxblood);stroke-width:1.5}
    .model-diagram [data-module].module-focus .model-wire{stroke:var(--oxblood)}
    .architecture-figure .model-diagram text{font-size:11.5px}
    .architecture-figure .model-diagram .diagram-title{font-size:13px}
    .architecture-figure .model-diagram .diagram-label{font-size:11.5px}
    .architecture-figure .model-diagram .diagram-note{font-size:11px}
    .architecture-figure .model-diagram .diagram-note.accent{fill:var(--oxblood)}
    .architecture-figure .model-diagram .joint-divider{stroke:var(--rule-dotted);stroke-width:1}
    .architecture-figure .model-diagram .zoom-outline{fill:none;stroke:var(--oxblood);stroke-width:1.25}
    .model-diagram .flow-cell,.model-diagram .flow-core{transform-box:fill-box;transform-origin:center;animation:model-data-pulse 8.4s ease-in-out infinite both;animation-delay:calc(var(--flow-step) * .29s)}
    .model-diagram .flow-core{animation-name:model-core-pulse}
    .model-diagram .flow-link{animation:model-link-pulse 8.4s ease-in-out infinite both;animation-delay:calc(var(--flow-step) * .29s)}
    @keyframes model-data-pulse{
      0%,11%,100%{fill:var(--paper);stroke:var(--rule-dotted);transform:scale(1)}
      5%{fill:rgba(123,46,46,.10);stroke:var(--oxblood);transform:scale(1.025)}
    }
    @keyframes model-core-pulse{
      0%,11%,100%{fill:var(--paper);stroke:var(--ink);transform:scale(1)}
      5%{fill:rgba(123,46,46,.06);stroke:var(--oxblood);transform:scale(1.012)}
    }
    @keyframes model-link-pulse{
      0%,11%,100%{stroke:var(--ink-faint);opacity:.72}
      5%{stroke:var(--oxblood);opacity:1}
    }
    .mtp-diagram{min-height:164px}
    .factor-bars{padding:14px 3px 4px}
    .factor-bar-head,.factor-bar-row{display:grid;grid-template-columns:175px 1fr 1fr;gap:18px;align-items:center}
    .factor-bar-head{padding-bottom:8px;border-bottom:1px solid var(--rule)}
    .factor-bar-head span{font:500 .61rem/1.3 var(--mono);color:var(--ink-faint)}
    .factor-bar-head span:not(:first-child){text-align:center}
    .factor-bar-row{padding:11px 0;border-bottom:1px dotted var(--rule-dotted)}
    .factor-bar-row:last-child{border-bottom:0}
    .factor-bar-label b{display:block;font:600 .66rem/1.3 var(--mono)}
    .factor-bar-label span{display:block;font:400 .57rem/1.35 var(--mono);color:var(--ink-faint);margin-top:2px}
    .factor-bar-row.flagship .factor-bar-label b{color:var(--oxblood)}
    .factor-track{position:relative;height:30px;background:var(--surface-aside);overflow:visible}
    .factor-track::before{content:"";position:absolute;left:var(--zero);top:-3px;bottom:-3px;border-left:1px solid var(--ink-faint)}
    .factor-track i{position:absolute;top:8px;height:14px;background:var(--ink);opacity:.65}
    .factor-bar-row.flagship .factor-track i{background:var(--oxblood);opacity:1}
    .factor-track output{position:absolute;top:50%;font:600 .61rem/1 var(--mono);white-space:nowrap;color:var(--ink)}
    .factor-bar-row.flagship .factor-track output{color:var(--oxblood)}
    .codec-lineage{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding:18px 3px 8px}
    .codec-stage{min-width:0;border-top:1px solid var(--ink);padding-top:9px}
    .codec-stage-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
    .codec-stage-head b{font:600 .72rem/1.3 var(--mono)}
    .codec-stage-head span{font:400 .58rem/1.3 var(--mono);color:var(--ink-faint);text-align:right}
    .codec-stage.polar .codec-stage-head b{color:var(--oxblood)}
    .codec-lane-label{display:block;margin-bottom:6px;font:500 .56rem/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
    .codec-button-demo{min-height:79px;padding-bottom:11px;border-bottom:1px dotted var(--rule-dotted)}
    .codec-collapse{display:grid;grid-template-columns:minmax(0,1fr) 18px minmax(0,1fr);gap:5px;align-items:center;margin-top:11px}
    .codec-chord,.codec-class{display:flex;min-height:30px;align-items:center;justify-content:center;border:1px solid var(--rule-dotted);font:600 .61rem/1.25 var(--mono);text-align:center}
    .codec-collapse i{font:normal 400 .65rem/1 var(--mono);color:var(--ink-faint);text-align:center}
    .codec-stick{padding:12px 0 10px;border-bottom:1px dotted var(--rule-dotted)}
    .codec-stick-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
    .codec-stick-head b{font:600 .61rem/1.3 var(--mono)}
    .codec-stick-head span{font:400 .56rem/1.3 var(--mono);color:var(--ink-faint);text-align:right}
    .codec-stick-map{display:block;width:100%;height:132px;margin:5px 0 1px}
    .codec-stick-map .stick-axis{stroke:var(--rule-dotted);stroke-width:1}
    .codec-stick-map .stick-rim{fill:none;stroke:var(--rule);stroke-width:1}
    .codec-stick-map .stick-ring{fill:none;stroke:var(--rule-dotted);stroke-width:1;stroke-dasharray:2 3}
    .codec-stick-map .stick-point{fill:var(--ink);opacity:.68}
    .codec-stage.polar .codec-stick-map .stick-point{fill:var(--oxblood);opacity:.88}
    .codec-results{padding:20px 3px 2px;border-top:1px solid var(--rule);margin-top:14px}
    .codec-result-head,.codec-result-row{display:grid;grid-template-columns:190px 1fr 1fr;gap:18px;align-items:center}
    .codec-result-head{padding-bottom:8px;border-bottom:1px solid var(--rule)}
    .codec-result-head span{font:500 .61rem/1.3 var(--mono);color:var(--ink-faint)}
    .codec-result-head span:not(:first-child){text-align:center}
    .codec-result-pair{padding:12px 0 4px;border-bottom:1px dotted var(--rule-dotted)}
    .codec-result-pair:last-child{border-bottom:0}
    .codec-pair-title{margin-bottom:3px;font-family:var(--mono)}
    .codec-pair-title b{font-size:.65rem}
    .codec-result-row{padding:7px 0}

.wb-body pre code{background:none;padding:0;font-size:inherit}
.wb-body .figref{font-family:var(--font-mono);font-size:.82em;color:var(--oxblood);text-decoration:none;border-bottom:1px solid var(--rule-underline)}
.wb-body .figref.missing{color:var(--ink-faint);border-bottom-style:dotted}
.wb-block[data-type="callout"] .wb-body{background:var(--surface-aside);border:1px solid var(--aside-border);padding:14px 18px;margin:1.4rem 0;max-width:var(--measure)}
.wb-block[data-type="callout"] .wb-body p:last-child{margin-bottom:0}

/* the one card: white, ink hairline, hard offset shadow, an ink tab notched over the corner */
.wb-block[data-type="card"] .wb-body{position:relative;background:var(--white);border:1px solid var(--frame-border);box-shadow:var(--shadow-frame);padding:22px 20px 14px;margin:1.8rem 0 1.6rem;max-width:var(--measure)}
.wb-card-tab{position:absolute;top:-11px;left:14px;background:var(--ink);color:var(--paper);font:600 .62rem/1.3 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;padding:3px 9px}
.wb-block[data-type="card"] .wb-body ul,.wb-block[data-type="card"] .wb-body ol{margin:.2rem 0 0}
.wb-block[data-type="card"] .wb-body p:last-child{margin-bottom:0}
body.wb-edit .wb-block[data-type="card"] .wb-body{cursor:text}

/* figure blocks — the numbered caption is derived from order */
.wb-block[data-type="figure"]{margin:var(--space-fig) 0}
.wb-block[data-type="figure"] .fig-src{display:block}
.wb-block[data-type="figure"] .fig-src > figure{margin-block:0}
.wb-fig-caption{font:var(--mono-meta-weight) var(--mono-meta-size)/1.5 var(--font-mono);letter-spacing:var(--mono-meta-ls);color:var(--text-mono);margin-top:9px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.wb-fig-caption .fig-num{color:var(--ink);font-weight:500;white-space:nowrap}
.wb-fig-caption .fig-text{flex:1;min-width:200px}
.wb-fig-caption .fig-text p{margin:0;font:inherit;color:inherit;max-width:none}
.wb-fig-caption .fig-key{color:var(--ink-faint);text-transform:lowercase}
.wb-fig-caption .wb-data-btn{margin-left:auto}
.fig-missing{border:1px dotted var(--rule-dotted);padding:14px;font:var(--mono-meta-size)/1.5 var(--font-mono);color:var(--text-mono)}
.svg-figure{margin:0;background:var(--white);border:1px solid var(--frame-border);padding:var(--frame-pad);box-shadow:var(--shadow-frame)}
.svg-figure img{display:block;width:100%;height:auto}
.fig-src.xfig{width:min(var(--breakout),calc(100vw - 32px));margin-left:50%;transform:translateX(-50%)}
.fig-src.xfig .panel,.fig-src.xfig figure{box-shadow:var(--shadow-frame)}
.fig-src.xfig .toy{background:var(--white);border:1px solid var(--frame-border);padding:var(--frame-pad);box-shadow:var(--shadow-frame)}
.fig-src.xfig .chart-row figure{background:var(--white);border:1px solid var(--frame-border)}

/* the data drawer: the rows a figure reads, as a plain table */
.wb-data-btn{font:var(--mono-meta-weight) var(--mono-meta-size)/1.4 var(--font-mono);letter-spacing:var(--mono-meta-ls);color:var(--text-mono);background:transparent;border:0;border-bottom:1px dotted var(--rule-dotted);padding:0 0 1px;cursor:pointer}
.wb-data-btn:hover{color:var(--oxblood);border-bottom-color:var(--oxblood)}
.wb-data-btn[aria-expanded="true"]{color:var(--ink)}
.wb-drawer{margin-top:10px;background:var(--surface-aside);border:1px solid var(--aside-border);padding:12px 14px;font-size:.82rem}
.wb-drawer[hidden]{display:none}
.wb-drawer-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;font:var(--mono-meta-size)/1.4 var(--font-mono);letter-spacing:var(--mono-meta-ls);color:var(--text-mono);margin-bottom:8px}
.wb-drawer-head b{color:var(--ink);font-weight:500}
.wb-drawer-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.wb-drawer-tabs button{font:var(--mono-meta-size)/1.4 var(--font-mono);color:var(--text-mono);background:transparent;border:1px dotted var(--rule-dotted);padding:3px 8px;cursor:pointer}
.wb-drawer-tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.wb-drawer .scroll{overflow:auto;max-height:420px}
.wb-drawer table{border-collapse:collapse;width:100%;font:.72rem/1.45 var(--font-mono);font-variant-numeric:tabular-nums}
.wb-drawer th{position:sticky;top:0;background:var(--surface-aside);text-align:left;font-weight:500;letter-spacing:.04em;padding:4px 8px;border-bottom:1px solid var(--rule-dotted);white-space:nowrap}
.wb-drawer td{padding:4px 8px;border-bottom:1px solid var(--rule);vertical-align:top;max-width:360px;overflow-wrap:anywhere}
.wb-drawer td.num{text-align:right;white-space:nowrap}
.wb-drawer a{color:var(--oxblood)}
.wb-drawer pre{margin:0;font:.7rem/1.45 var(--font-mono);white-space:pre-wrap;background:transparent;border:0;padding:0}
.wb-drawer .empty{color:var(--text-mono);font-family:var(--font-mono);font-size:.72rem}
body.wb-showdata .wb-drawer{display:block}

/* ---------- floating contents ---------- */
.wb-toc{position:fixed;left:18px;top:96px;z-index:15;max-width:220px;font-family:var(--font-mono)}
.wb-toc-toggle{font:600 .62rem/1.3 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-mono);background:var(--paper);border:1px dotted var(--rule-dotted);padding:5px 9px;cursor:pointer}
.wb-toc-toggle:hover,.wb-toc[data-open="true"] .wb-toc-toggle{color:var(--ink);border-color:var(--ink)}
.wb-toc-list{list-style:none;margin:6px 0 0;padding:8px 0 8px 10px;border-left:2px solid var(--rule);max-height:calc(100vh - 150px);overflow:auto;background:var(--paper)}
.wb-toc[data-open="false"] .wb-toc-list{display:none}
.wb-toc-list li{margin:0;padding:0}
.wb-toc-list a{display:block;font:.68rem/1.5 var(--font-mono);letter-spacing:.02em;color:var(--ink-mono);text-decoration:none;padding:2px 8px 2px 6px;margin-left:-12px;border-left:2px solid transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:210px}
.wb-toc-list a:hover{color:var(--ink)}
.wb-toc-list a[aria-current="true"]{color:var(--ink);border-left-color:var(--oxblood)}
.wb-toc-list li[data-level="3"] a{padding-left:16px;color:var(--ink-faint)}
.wb-toc-list li[data-level="3"] a:hover,.wb-toc-list li[data-level="3"] a[aria-current="true"]{color:var(--ink)}
.wb-toc-list li[data-level="4"]{display:none}
.wb-toc-list .num{color:var(--ink-faint);margin-right:6px}
@media (max-width:1180px){.wb-toc{left:12px;top:auto;bottom:16px;max-width:260px}.wb-toc-list{max-height:50vh;box-shadow:var(--shadow-frame-sm);border:1px solid var(--rule-dotted);border-left:2px solid var(--rule);padding-right:8px}}
@media (max-width:760px){.wb-toc{display:none}}

/* ---------- edit mode ---------- */
.wb-handle,.wb-menu-btn,.wb-insert,.wb-note{display:none}
body.wb-static #source-toggle,body.wb-static .fig-key{display:none}
/* a single-figure page (build.py --figures): the figure, its caption and the data/ink tools, nothing else */
.wb-figure-page .wb-top-left,.wb-figure-page .wb-toc,.wb-figure-page .wb-foot{display:none}
.wb-figure-page .wb-top{justify-content:flex-end;padding-top:18px}
body.wb-edit .wb-block{padding-left:0;border-left:2px solid transparent;transition:border-color var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease)}
body.wb-edit .wb-block:hover{border-left-color:var(--rule-dotted)}
body.wb-edit .wb-block.dragging{opacity:.46}
body.wb-edit .wb-block.drop-before{box-shadow:0 -2px 0 var(--oxblood)}
body.wb-edit .wb-block.drop-after{box-shadow:0 2px 0 var(--oxblood)}
body.wb-edit .wb-handle{display:flex;position:absolute;left:-44px;top:4px;width:30px;height:30px;align-items:center;justify-content:center;cursor:grab;color:var(--ink-faint);font:.9rem/1 var(--font-mono);border:1px dotted transparent;user-select:none;touch-action:none}
body.wb-edit .wb-handle:hover{color:var(--ink);border-color:var(--rule-dotted);background:var(--surface-aside)}
body.wb-edit .wb-menu-btn{display:flex;position:absolute;right:-44px;top:4px;width:30px;height:30px;align-items:center;justify-content:center;color:var(--ink-faint);background:transparent;border:1px dotted transparent;cursor:pointer;font:600 .9rem/1 var(--font-mono)}
body.wb-edit .wb-menu-btn:hover,body.wb-edit .wb-menu-btn[aria-expanded="true"]{color:var(--ink);border-color:var(--rule-dotted);background:var(--surface-aside)}
body.wb-edit .wb-block[data-type="figure"] .wb-menu-btn{right:-44px}
.wb-menu{position:absolute;right:-44px;top:36px;z-index:20;background:var(--white);border:1px solid var(--frame-border);box-shadow:var(--shadow-frame);display:flex;flex-direction:column;min-width:150px}
.wb-menu button{font:var(--mono-meta-size)/1.4 var(--font-mono);letter-spacing:var(--mono-meta-ls);text-align:left;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--rule);padding:8px 12px;cursor:pointer}
.wb-menu button:last-child{border-bottom:0}
.wb-menu button:hover{background:var(--surface-aside)}
.wb-menu button.danger{color:var(--oxblood)}
body.wb-edit .wb-insert{display:flex;justify-content:center;height:0;position:relative;z-index:5}
body.wb-edit .wb-insert button{position:relative;top:-11px;font:500 .68rem/1 var(--font-mono);letter-spacing:.06em;color:var(--ink-faint);background:var(--paper);border:1px dotted var(--rule);padding:4px 10px;cursor:pointer;opacity:.55;transition:opacity var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease)}
body.wb-edit .wb-insert:hover button,body.wb-edit .wb-insert button:focus-visible,body.wb-edit .wb-insert button[aria-expanded="true"]{opacity:1;border-color:var(--rule-dotted);color:var(--ink)}
.wb-insert-menu{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:30;background:var(--white);border:1px solid var(--frame-border);box-shadow:var(--shadow-frame);padding:8px;display:grid;grid-template-columns:repeat(4,auto);gap:4px}
.wb-insert-menu button{font:var(--mono-meta-size)/1.4 var(--font-mono);color:var(--ink);background:transparent;border:1px dotted var(--rule-dotted);padding:6px 10px;cursor:pointer}
.wb-insert-menu button:hover{background:var(--surface-aside)}
body.wb-notes .wb-note{display:block;font:var(--mono-meta-size)/1.5 var(--font-mono);letter-spacing:var(--mono-meta-ls);color:var(--ink-soft);background:color-mix(in srgb,var(--oxblood) 6%,transparent);border-left:2px solid var(--oxblood);padding:6px 10px;margin:6px 0 4px;white-space:pre-wrap}
body.wb-notes .wb-note::before{content:"note · ";color:var(--oxblood)}
body.wb-notes .wb-note[data-empty]{display:none}
body.wb-edit .wb-block[data-type="text"] .wb-body,body.wb-edit .wb-block[data-type="heading"] .wb-body,body.wb-edit .wb-block[data-type="callout"] .wb-body{cursor:text}

/* the editor: markdown on the left, live preview beneath at narrow widths */
.wb-editor{margin:.4rem 0 1rem;border:1px solid var(--frame-border);background:var(--white);box-shadow:var(--shadow-frame-sm)}
.wb-editor textarea{display:block;width:100%;min-height:120px;resize:vertical;border:0;border-bottom:1px solid var(--rule);background:transparent;color:var(--ink);font:.84rem/1.55 var(--font-mono);padding:12px 14px;outline:none}
.wb-editor textarea:focus-visible{outline:var(--focus-outline);outline-offset:-2px}
.wb-editor-bar{display:flex;gap:6px;align-items:center;padding:8px 10px;flex-wrap:wrap}
.wb-editor-bar .hint{font:var(--mono-ghost-size)/1.4 var(--font-mono);color:var(--text-mono);margin-right:auto}
.wb-editor-bar button{font:var(--mono-meta-weight) var(--mono-meta-size)/1.4 var(--font-mono);letter-spacing:var(--mono-meta-ls);padding:6px 12px;border:1px solid var(--frame-border);background:var(--white);color:var(--ink);cursor:pointer;transition:transform var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease)}
.wb-editor-bar button.primary{background:var(--ink);color:var(--paper)}
.wb-editor-bar button.primary:hover{transform:var(--lift);box-shadow:var(--shadow-frame-sm)}
.wb-editor-bar button.quiet{border-color:transparent;color:var(--text-mono)}
.wb-editor-bar button.quiet:hover{background:var(--surface-aside)}
.wb-editor-preview{padding:6px 14px 2px;border-top:1px dotted var(--rule-dotted);font-size:.95rem}
.wb-editor-preview:empty{display:none}
.wb-editor label{display:flex;gap:8px;align-items:baseline;font:var(--mono-meta-size)/1.4 var(--font-mono);color:var(--text-mono);padding:8px 14px 0}
.wb-editor label input,.wb-editor label select{font:.8rem/1.4 var(--font-mono);border:1px solid var(--rule-dotted);background:var(--paper);color:var(--ink);padding:4px 8px}

/* figure picker */
.wb-picker{position:fixed;inset:auto 0 0 0;max-height:70vh;overflow:auto;z-index:50;background:var(--white);border-top:1px solid var(--frame-border);box-shadow:0 -3px 0 var(--shadow-ink-12);padding:16px var(--col-pad) 28px}
.wb-picker-inner{max-width:var(--breakout);margin:0 auto}
.wb-picker-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;font:var(--mono-marker-weight) var(--mono-marker-size)/1.4 var(--font-mono);letter-spacing:var(--mono-marker-ls);text-transform:uppercase;color:var(--ink)}
.wb-picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.wb-picker-grid button{text-align:left;font:inherit;background:var(--paper);border:1px solid var(--rule-dotted);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.wb-picker-grid button:hover{border-color:var(--ink);background:var(--white)}
.wb-picker-grid button .k{font:.66rem/1.3 var(--font-mono);color:var(--text-mono);letter-spacing:.02em}
.wb-picker-grid button .n{font-size:.92rem;line-height:1.35}
.wb-picker-grid button .s{font:.66rem/1.3 var(--font-mono);color:var(--oxblood)}
.wb-picker-grid button[disabled]{opacity:.45;cursor:not-allowed}

/* parked tray */
.wb-parked{margin-top:5rem;padding-top:1rem;border-top:1px dotted var(--rule-dotted)}
.wb-parked-head{font:600 .8rem/1.4 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;margin:0 0 .5rem;padding-bottom:7px;border-bottom:2px solid var(--ink)}
.wb-parked-head .section-number{float:right;color:var(--ink-faint);font-weight:400}
.wb-parked-note{font:var(--mono-meta-size)/1.5 var(--font-mono);color:var(--text-mono);margin:0 0 1rem}
.wb-parked-item{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--rule);font-size:.9rem}
.wb-parked-item .t{font:.66rem/1.3 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--text-mono);min-width:56px}
.wb-parked-item .p{flex:1;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wb-parked-item button{font:var(--mono-meta-size)/1.4 var(--font-mono);color:var(--ink);background:transparent;border:1px dotted var(--rule-dotted);padding:3px 8px;cursor:pointer}
.wb-parked-item button:hover{background:var(--surface-aside)}
.wb-parked-item button.danger{color:var(--oxblood)}

.wb-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);font:var(--mono-meta-size)/1.4 var(--font-mono);letter-spacing:var(--mono-meta-ls);padding:8px 14px;box-shadow:var(--shadow-frame);opacity:0;transition:opacity var(--dur-mid) var(--ease)}
.wb-toast.on{opacity:1}

@media (max-width:1024px){
  body.wb-edit .wb-handle{left:-34px}
  body.wb-edit .wb-menu-btn{right:-34px}
  .wb-menu{right:-34px}
}
@media (max-width:760px){
  body.wb-edit .wb-block{padding-left:34px}
  body.wb-edit .wb-handle{left:0}
  body.wb-edit .wb-menu-btn{right:0}
  .wb-menu{right:0}
  .wb-insert-menu{grid-template-columns:repeat(2,auto)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}

.wb-math{font-size:.95em}
div.wb-math{margin:0 0 var(--space-para);overflow-x:auto;max-width:var(--measure)}

/* footnotes */
.wb-fnref{font-size:.7em;line-height:0;vertical-align:super}
.wb-fnref a{text-decoration:none;color:var(--oxblood)}
.wb-footnotes{margin:1.2rem 0 0;padding:.6rem 0 0 1.4rem;border-top:1px solid var(--rule);font-size:.86em;color:var(--ink-soft)}
.wb-footnotes li{margin:.25rem 0}
.wb-fnback{text-decoration:none;color:var(--ink-faint)}

/* ---------- custom workbench figures: architecture + dependencies share the page's model-diagram grammar ---------- */
.arch-figure .model-diagram,.deps-figure .model-diagram{display:block;width:100%;height:auto}
.architecture-figure .model-diagram .diagram-note.play{fill:var(--oxblood)}
.architecture-figure .model-diagram .model-token.played{fill:color-mix(in srgb,var(--oxblood) 8%,var(--paper));stroke:var(--oxblood)}
.architecture-figure .model-diagram .model-token.given{fill:var(--surface-aside);stroke:var(--rule-dotted)}
.architecture-figure .model-diagram .model-token.given text,.architecture-figure .model-diagram .given-label{fill:var(--ink-soft)}
.architecture-figure .model-diagram .model-token.queued{fill:var(--paper);stroke:var(--ink-faint);stroke-dasharray:3 3}
.architecture-figure .model-diagram .model-wire.ghost{stroke-dasharray:2 4}
.architecture-figure .model-diagram [data-module]{transition:opacity .16s ease}
.architecture-figure .model-diagram .hit{fill:transparent;stroke:none;cursor:pointer}
.arch-cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:14px 0 0}
.arch-cards button{text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule-dotted);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:58px;transition:border-color .14s ease,background .14s ease}
.arch-cards button:hover{border-color:var(--ink)}
.arch-cards button[aria-selected="true"]{background:var(--white);border-color:var(--ink);box-shadow:2px 2px 0 var(--shadow-soft)}
.arch-cards .n{font:600 .62rem/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mono)}
.arch-cards button[aria-selected="true"] .n{color:var(--oxblood)}
.arch-cards .t{font-size:.96rem;line-height:1.3}
.arch-cards .r{font:.68rem/1.4 var(--mono);color:var(--ink-mono)}
.arch-detail{margin-top:12px;border-top:1px dotted var(--rule-dotted);padding-top:14px}
.arch-detail[hidden]{display:none}
.arch-detail .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.arch-detail h5{margin:0;font-size:1.05rem;line-height:1.3}
.arch-detail .close{font:.66rem/1.3 var(--mono);color:var(--ink-mono);background:transparent;border:0;border-bottom:1px dotted var(--rule-dotted);cursor:pointer;padding:0}
.arch-detail .close:hover{color:var(--oxblood)}
.arch-detail .mech{margin:4px 0 12px}
.arch-detail .mech svg{display:block;width:100%;height:auto}
.arch-detail .prose{columns:2;column-gap:28px;max-width:none}
.arch-detail .prose p{font-size:.9rem;line-height:1.55;margin:0 0 .7em;color:var(--ink-soft);break-inside:avoid}
@media (max-width:760px){.arch-cards{grid-template-columns:repeat(2,minmax(0,1fr))}.arch-detail .prose{columns:1}.arch-figure .model-diagram,.deps-figure .model-diagram{min-width:0}}

/* ---------- action logit paths ---------- */
.logit-figure .model-diagram{display:block;width:100%;height:auto}
.logit-figure #logit-forest{margin-top:14px;padding-top:12px;border-top:1px dotted var(--rule-dotted)}
.logit-figure .forest-row .hit{fill:transparent;stroke:none}
.logit-figure .forest-row:hover .hit{fill:color-mix(in srgb,var(--oxblood) 5%,transparent)}
.rle-diagram svg{display:block;width:100%;height:auto}
.rle-diagram text{font-family:var(--mono);font-variant-numeric:tabular-nums}
.rle-diagram .lbl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;fill:var(--ink)}
.rle-diagram .sub{font-size:10px;fill:var(--ink-mono)}
.rle-diagram .tiny{font-size:8.5px;fill:var(--ink-mono)}
.rle-diagram .sym{font-size:11px;fill:var(--ink)}
.rle-diagram .plate{fill:var(--paper);stroke:var(--ink);stroke-width:1.1}

/* ---------- run-length spans ---------- */
.rle-diagram .frame{fill:var(--paper);stroke:var(--ink);stroke-width:1}
.rle-diagram .frame.b{fill:color-mix(in srgb,var(--ink) 8%,var(--paper))}
.rle-diagram .frame.c{fill:color-mix(in srgb,var(--ink) 16%,var(--paper))}
.rle-diagram .span{fill:color-mix(in srgb,var(--oxblood) 9%,var(--paper));stroke:var(--oxblood);stroke-width:1.1}
.rle-diagram .brace{fill:none;stroke:var(--ink-faint);stroke-width:1}
.rle-diagram .stat{font-size:15px;fill:var(--ink)}

/* ---------- AWR ledger ---------- */
.ledger-controls{display:flex;flex-direction:column;gap:8px;margin:0 0 10px}
.ledger-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}

  function studyHtml(s) {

    if (s.setup) parts.push('<p class="empty" style="margin:0 0 6px">' + escapeHtml(s.setup) + '</p>');
    var rest = {};
    Object.keys(s).forEach(function (k) { if (['id', 'title', 'evidence', 'claim', 'setup', 'section', 'arms', 'comparison', 'comparisons', 'series', 'code'].indexOf(k) === -1) rest[k] = s[k]; });

  function studiesHtml(entry, query) {

  function buildDrawer(entry) {

  /* ------------------------------------------------------------------ block rendering */
  function blockElement(id) {

    node.appendChild(el('button', {type: 'button', class: 'wb-menu-btn', 'aria-label': 'Block actions', 'aria-haspopup': 'menu', 'aria-expanded': 'false', text: '⋯', onclick: function (e) { e.stopPropagation(); toggleMenu(id, node); }}));

  function clearDropMarks() { $$('.drop-before,.drop-after').forEach(function (n) { n.classList.remove('drop-before', 'drop-after'); }); }

  function paintBlock(id, b, figNums, secNums) {
    var node = blockElement(id);

    if (state.rendered[id] === signature && body.childNodes.length) return node;
    state.rendered[id] = signature;

    if (b.type === 'figure') {
      var entry = REG[b.fig] || {key: b.fig, name: b.fig, source: 'missing', data: []};
      if (b.fig) releaseFigure(b.fig);

      body.appendChild(host);

      cap.appendChild(el('span', {class: 'fig-num', text: 'Fig ' + (figNums[id] || '?')}));
      cap.appendChild(el('span', {class: 'fig-text', html: b.caption ? md2html(b.caption, figNums) : '<p><em>no caption yet</em></p>'}));

    }

    }

  function insertBar(index) {

  function render() {

      var b = state.blocks[id];

      if (b.hidden) {

        return;
      }
      place(paintBlock(id, b, figNums, secNums));

  }

  var tocList = document.getElementById('wb-toc-list');

  function renderParked() {

  /* ------------------------------------------------------------------ menus, editor, picker */
  function closeMenus() {

  }

  function toggleMenu(id, node) {

  function openEditor(id, focusNote) {

    function paintPreview() {

  function autosize(ta) { ta.style.height = 'auto'; ta.style.height = Math.min(600, Math.max(120, ta.scrollHeight + 4)) + 'px'; }
  function closeEditor(save) {

    state.editorFields = null;

    var patch = {note: f.note.value.trim()};
    if (f.isFigure) {

    } else {

  function openPicker(index) {
    $$('.wb-picker').forEach(function (p) { p.remove(); });
    var placed = {};

    ]));
    var grid = el('div', {class: 'wb-picker-grid'});
    REGISTRY.forEach(function (entry) {
      var stateLabel = placed[entry.key] || '';
      var btn = el('button', {type: 'button', disabled: stateLabel === 'placed'}, [
        el('span', {class: 'k', text: entry.key + ' · ' + entry.source}),
        el('span', {class: 'n', text: entry.name}),

      ]);

        sheet.remove();

          var ids = order().filter(function (id) { return id !== pid; });

    });
    inner.appendChild(grid);
    sheet.appendChild(inner);
    sheet.addEventListener('click', function (e) { e.stopPropagation(); });
    document.body.appendChild(sheet);
  }

  /* ------------------------------------------------------------------ export */
  function exportMarkdown() {
    var figNums = figureNumbers();
    var out = [];
    visibleIds().forEach(function (id) {
      var b = state.blocks[id];
      if (b.type === 'heading') { out.push('#'.repeat(b.level || 2) + ' ' + (b.md || '').replace(/^#+\s*/, '')); out.push(''); return; }
      if (b.type === 'figure') {
        var entry = REG[b.fig] || {name: b.fig};
        out.push('> **FIGURE ' + figNums[id] + ' — ' + entry.name + '** `' + b.fig + '`');
        if (b.caption) { out.push('>'); out.push('> ' + b.caption.replace(/\n/g, '\n> ')); }
        out.push('');
        return;
      }
      var md = (b.md || '').replace(/\{\{\s*fig:([a-z0-9-]+)\s*\}\}/gi, function (_, k) { return figNums[k] ? 'Fig ' + figNums[k] : 'Fig ?'; });
      if (b.type === 'callout' || b.type === 'card') md = md.split('\n').map(function (l) { return '> ' + l; }).join('\n');
      out.push(md);
      out.push('');
    });
    return out.join('\n').replace(/\n{3,}/g, '\n\n');
  }
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    var ta = el('textarea', {style: 'position:fixed;left:-9999px'});
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } finally { ta.remove(); }
    return Promise.resolve();
  }

  /* ------------------------------------------------------------------ shell controls */
  var editBtn = document.getElementById('wb-edit');
  var dataBtn = document.getElementById('wb-data');
  var notesBtn = document.getElementById('wb-notes');
  var themeBtn = document.getElementById('wb-theme');
  function setEdit(on) {
    state.edit = on;
    document.body.classList.toggle('wb-edit', on);
    editBtn.setAttribute('aria-pressed', String(on));
    if (!on && state.editing) closeEditor(true);
    try { localStorage.setItem('wb-edit', on ? '1' : '0'); } catch (err) { /* per-viewer convenience only */ }
    render();
  }
  function setData(on) {
    state.showData = on;
    document.body.classList.toggle('wb-showdata', on);
    dataBtn.setAttribute('aria-pressed', String(on));
    $$('.wb-drawer').forEach(function (d) { d.hidden = !on; });
    $$('.wb-data-btn').forEach(function (b) { b.setAttribute('aria-expanded', String(on)); b.textContent = on ? 'data ▴' : 'data ▾'; });
    try { localStorage.setItem('wb-data', on ? '1' : '0'); } catch (err) { /* per-viewer convenience only */ }
  }
  function setNotes(on) {
    state.showNotes = on;
    document.body.classList.toggle('wb-notes', on);
    notesBtn.setAttribute('aria-pressed', String(on));
    try { localStorage.setItem('wb-notes', on ? '1' : '0'); } catch (err) { /* per-viewer convenience only */ }
  }
  dataBtn.addEventListener('click', function () { setData(!state.showData); });
  if (!STATIC) {
    notesBtn.addEventListener('click', function () { setNotes(!state.showNotes); });
    editBtn.addEventListener('click', function () { setEdit(!state.edit); });
    document.getElementById('wb-export').addEventListener('click', function () {
      copyText(exportMarkdown()).then(function () { toast('markdown copied · ' + visibleIds().length + ' blocks'); }, function () { toast('copy failed — select the text manually'); });
    });
  }

  function effectiveTheme() {
    var stamped = document.documentElement.getAttribute('data-theme');
    if (stamped === 'dark' || stamped === 'ink') return 'dark';
    if (stamped === 'light') return 'light';
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function paintTheme() { themeBtn.textContent = effectiveTheme() === 'dark' ? 'paper' : 'ink'; themeBtn.setAttribute('aria-label', 'Switch to ' + themeBtn.textContent + ' mode'); }
  themeBtn.addEventListener('click', function () {
    var next = effectiveTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('wb-theme', next); } catch (err) { /* per-viewer convenience only */ }
    paintTheme();
    document.dispatchEvent(new CustomEvent('hal:theme', {detail: next}));
    if (window.HALFIG_ANATOMY && window.HALFIG_ANATOMY.rerender) setTimeout(window.HALFIG_ANATOMY.rerender, 0);
  });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintTheme);

  // figure-key datalist for the editor
  if (!STATIC) {
    var dl = el('datalist', {id: 'wb-fig-keys'});
    REGISTRY.forEach(function (r) { dl.appendChild(el('option', {value: r.key, text: r.name})); });
    document.body.appendChild(dl);
  }

  /* ------------------------------------------------------------------ boot */
  try {
    var savedTheme = localStorage.getItem('wb-theme');
    if (savedTheme === 'dark' || savedTheme === 'light') document.documentElement.setAttribute('data-theme', savedTheme);
    if (!STATIC && localStorage.getItem('wb-edit') === '1') setEdit(true);
    if (localStorage.getItem('wb-data') === '1') setData(true);
    if (!STATIC && localStorage.getItem('wb-notes') === '1') setNotes(true);
  } catch (err) { /* private windows still render */ }
  paintTheme();
  if (STATIC) {
    document.body.classList.add('wb-static');
    state.outline = window.WB_SEED.outline;
    state.blocks = window.WB_SEED.blocks;
    render();
  } else {
    render();
    connect();
  }
}());

</script>
