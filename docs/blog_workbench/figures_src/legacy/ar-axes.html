<figure class="toy" id="fig-ar" data-name="ar-axes" data-name-title="The three autoregressive orderings">
    <svg viewBox="0 0 700 196" role="img" aria-label="Three orderings. Across time, each observed frame attends to earlier frames. Across the chunk, each predicted step reads the step before it. Within one frame, four controller groups are chosen in order.">
      <defs><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1 L10 5 L0 9 Z" fill="currentColor"/></marker></defs>

      <g data-part="time">
        <text x="60" y="32" font-size="11" fill="var(--ink2)">① across time — each frame reads earlier frames</text>
        <g fill="var(--s1)" opacity=".82">
          <rect x="60" y="44" width="58" height="26" rx="3"/><rect x="126" y="44" width="58" height="26" rx="3"/><rect x="192" y="44" width="58" height="26" rx="3"/>
        </g>
        <g fill="none" stroke="var(--s1)" stroke-width="1.3" color="var(--s1)">
          <path d="M 89 72 Q 122 90 155 72" marker-end="url(#aa)"/>
          <path d="M 155 72 Q 188 90 221 72" marker-end="url(#aa)"/>
          <path d="M 89 72 Q 155 104 221 72" marker-end="url(#aa)"/>
        </g>
        <g font-family="var(--mono)" font-size="9.5" fill="var(--ink3)" text-anchor="middle">
          <text x="89" y="120">t−2</text><text x="155" y="120">t−1</text><text x="221" y="120">t</text>
        </g>
      </g>

      <g data-part="state">
        <rect x="278" y="44" width="56" height="26" rx="3" fill="none" stroke="var(--s2)" stroke-width="1.2"/>
        <text x="306" y="61" text-anchor="middle" font-size="10.5" font-family="var(--mono)" fill="var(--ink)">h_t</text>
        <g color="var(--ink3)"><line x1="252" y1="57" x2="274" y2="57" stroke="currentColor" stroke-width="1.2" marker-end="url(#aa)"/></g>
      </g>

      <g data-part="chunk">
        <text x="372" y="32" font-size="11" fill="var(--ink2)">② across the chunk — each step reads the step before</text>
        <g fill="var(--s3)">
          <rect x="372" y="44" width="74" height="26" rx="3"/><rect x="462" y="44" width="74" height="26" rx="3"/><rect x="552" y="44" width="74" height="26" rx="3"/>
        </g>
        <g fill="none" stroke="var(--s3)" stroke-width="1.3" color="var(--s3)">
          <path d="M 409 72 Q 454 92 499 72" marker-end="url(#aa)"/>
          <path d="M 499 72 Q 544 92 589 72" marker-end="url(#aa)"/>
        </g>
        <g color="var(--ink3)" opacity=".5">
          <line x1="338" y1="57" x2="368" y2="57" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/>
        </g>
        <g font-family="var(--mono)" font-size="9.5" fill="var(--ink3)" text-anchor="middle">
          <text x="409" y="120">t+1</text><text x="499" y="120">t+2</text><text x="589" y="120">t+3</text>
        </g>
      </g>

      <g data-part="within">
        <g stroke="var(--s4)" stroke-width="1" stroke-dasharray="3 3" opacity=".8">
          <path d="M 409 126 L 409 136 M 300 136 L 518 136" fill="none"/>
        </g>
        <g>
          <rect x="300" y="142" width="44" height="24" rx="3" fill="var(--s4)"/>
          <rect x="358" y="142" width="44" height="24" rx="3" fill="var(--s4)"/>
          <rect x="416" y="142" width="44" height="24" rx="3" fill="var(--s4)"/>
          <rect x="474" y="142" width="44" height="24" rx="3" fill="var(--s4)"/>
        </g>
        <g font-family="var(--mono)" font-size="8.5" fill="var(--panel)" text-anchor="middle">
          <text x="322" y="158">c_stick</text><text x="380" y="158">main</text><text x="438" y="158">trig</text><text x="496" y="158">button</text>
        </g>
        <g color="var(--s4)" stroke="var(--s4)" stroke-width="1.3">
          <line x1="346" y1="154" x2="354" y2="154" marker-end="url(#aa)"/>
          <line x1="404" y1="154" x2="412" y2="154" marker-end="url(#aa)"/>
          <line x1="462" y1="154" x2="470" y2="154" marker-end="url(#aa)"/>
        </g>
        <text x="300" y="186" font-size="11" fill="var(--ink2)">③ within one frame — four groups, in a fixed order</text>
      </g>

      <g font-size="11" fill="var(--ink3)">
        <text x="60" y="148">① is ordinary causal attention</text>
        <text x="60" y="164">and is always on. ② and ③ can</text>
        <text x="60" y="180">each be switched off on their own.</text>
      </g>
    </svg>
  </figure>
