<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Action logit paths and O43 component ablations</title>
  <desc id="desc">The action logits combine temporal decoder state, within-frame FiLM conditioning, a nonlinear action head, and a direct trunk-to-logit skip. Removing or weakening each tested path reduced stock score.</desc>
  <style>
    .bg { fill: #fbfaf7; }
    .box { fill: #fff; stroke: #d7d2ca; stroke-width: 1.5; }
    .state { fill: #e5eef4; stroke: #88a9bf; stroke-width: 1.5; }
    .film { fill: #f2e9f3; stroke: #aa86ad; stroke-width: 1.5; }
    .head { fill: #eef2e8; stroke: #8fa870; stroke-width: 1.5; }
    .skip { fill: #f6e9df; stroke: #c9835d; stroke-width: 1.5; }
    .sum { fill: #315f8c; stroke: #274d72; stroke-width: 1.5; }
    .line { fill: none; stroke: #756f68; stroke-width: 1.7; marker-end: url(#arrow); }
    .grid { stroke: #dfdcd5; stroke-width: 1; }
    .zero { stroke: #4e4944; stroke-width: 1.8; }
    .ci-char { stroke: #315f8c; stroke-width: 3; }
    .ci-fox { stroke: #b95f36; stroke-width: 3; }
    .char { fill: #315f8c; }
    .fox { fill: #b95f36; }
    .ink { fill: #22201e; font-family: Inter, Arial, sans-serif; }
    .white { fill: #fff; font-family: Inter, Arial, sans-serif; }
    .muted { fill: #6f6962; font-family: Inter, Arial, sans-serif; }
    .blue { fill: #315f8c; font-family: Inter, Arial, sans-serif; }
    .orange { fill: #a44e2b; font-family: Inter, Arial, sans-serif; }
    .mono { fill: #22201e; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .h1 { font-size: 30px; font-weight: 700; }
    .h2 { font-size: 18px; font-weight: 700; }
    .label { font-size: 15px; font-weight: 650; }
    .small { font-size: 12.5px; }
    .tiny { font-size: 11px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#756f68"/></marker>
  </defs>
  <rect class="bg" width="1200" height="780"/>
  <text class="ink h1" x="42" y="52">Action Logit Paths</text>
  <text class="muted small" x="42" y="78">O43 tests one component at a time. Negative values favor the complete control path.</text>

  <rect class="box" x="42" y="106" width="1116" height="224" rx="10"/>
  <text class="ink h2" x="66" y="138">Complete O43 control</text>
  <rect class="state" x="72" y="176" width="150" height="70" rx="8"/>
  <text class="ink label" x="147" y="204" text-anchor="middle">Trunk state</text>
  <text class="mono small" x="147" y="228" text-anchor="middle">hₜ</text>

  <rect class="state" x="310" y="160" width="190" height="70" rx="8"/>
  <text class="ink label" x="405" y="188" text-anchor="middle">Temporal decoder</text>
  <text class="muted small" x="405" y="211" text-anchor="middle">future-frame state</text>
  <path class="line" d="M222 202 L306 195"/>

  <rect class="film" x="582" y="142" width="190" height="78" rx="8"/>
  <text class="ink label" x="677" y="171" text-anchor="middle">Within-frame FiLM</text>
  <text class="muted small" x="677" y="194" text-anchor="middle">earlier controller parts</text>
  <path class="line" d="M500 191 L578 184"/>

  <rect class="head" x="854" y="142" width="190" height="78" rx="8"/>
  <text class="ink label" x="949" y="171" text-anchor="middle">SiLU MLP head</text>
  <text class="muted tiny" x="949" y="194" text-anchor="middle">norm - linear - SiLU - linear</text>
  <path class="line" d="M772 181 L850 181"/>

  <rect class="skip" x="582" y="246" width="190" height="58" rx="8"/>
  <text class="ink label" x="677" y="270" text-anchor="middle">Direct trunk skip</text>
  <text class="muted small" x="677" y="290" text-anchor="middle">hₜ to linear logits</text>
  <path class="line" d="M222 220 C360 294 454 276 578 276"/>

  <circle class="sum" cx="1091" cy="224" r="28"/>
  <text class="white label" x="1091" y="230" text-anchor="middle">Σ</text>
  <path class="line" d="M1044 181 L1072 209"/>
  <path class="line" d="M772 276 L1070 235"/>
  <text class="muted small" x="1091" y="274" text-anchor="middle">action logits</text>

  <text class="ink h2" x="42" y="378">Direct change in net stocks / min</text>
  <text class="muted small" x="42" y="401">Point and 95% interval for treatment minus O43 arm A. Character suite is blue; Fox suite is orange.</text>

  <g>
    <line class="grid" x1="300" y1="432" x2="300" y2="690"/>
    <line class="grid" x1="407" y1="432" x2="407" y2="690"/>
    <line class="grid" x1="514" y1="432" x2="514" y2="690"/>
    <line class="grid" x1="621" y1="432" x2="621" y2="690"/>
    <line class="grid" x1="729" y1="432" x2="729" y2="690"/>
    <line class="grid" x1="836" y1="432" x2="836" y2="690"/>
    <line class="grid" x1="943" y1="432" x2="943" y2="690"/>
    <line class="zero" x1="1050" y1="432" x2="1050" y2="690"/>
    <text class="muted small" x="300" y="714" text-anchor="middle">-2.8</text>
    <text class="muted small" x="407" y="714" text-anchor="middle">-2.4</text>
    <text class="muted small" x="514" y="714" text-anchor="middle">-2.0</text>
    <text class="muted small" x="621" y="714" text-anchor="middle">-1.6</text>
    <text class="muted small" x="729" y="714" text-anchor="middle">-1.2</text>
    <text class="muted small" x="836" y="714" text-anchor="middle">-0.8</text>
    <text class="muted small" x="943" y="714" text-anchor="middle">-0.4</text>
    <text class="muted small" x="1050" y="714" text-anchor="middle">0</text>
  </g>

  <text class="ink label" x="42" y="472">Zero-initialize FiLM</text>
  <text class="muted small" x="42" y="492">U4,096 · vzd242t6</text>
  <line class="ci-char" x1="667" y1="462" x2="849" y2="462"/>
  <circle class="char" cx="758" cy="462" r="7"/>
  <line class="ci-fox" x1="629" y1="490" x2="828" y2="490"/>
  <path class="fox" d="M729 481 l9 9 -9 9 -9 -9z"/>
  <text class="mono small" x="1070" y="467">-1.09 ± .34</text>
  <text class="mono small" x="1070" y="495">-1.20 ± .37</text>

  <text class="ink label" x="42" y="562">Remove trunk skip</text>
  <text class="muted small" x="42" y="582">U4,096 · j4skyy83</text>
  <line class="ci-char" x1="704" y1="552" x2="919" y2="552"/>
  <circle class="char" cx="812" cy="552" r="7"/>
  <line class="ci-fox" x1="624" y1="580" x2="871" y2="580"/>
  <path class="fox" d="M747 571 l9 9 -9 9 -9 -9z"/>
  <text class="mono small" x="1070" y="557">-0.89 ± .40</text>
  <text class="mono small" x="1070" y="585">-1.13 ± .46</text>

  <text class="ink label" x="42" y="652">Use normalized linear heads</text>
  <text class="muted small" x="42" y="672">U8,192 · apj3rw8b</text>
  <line class="ci-char" x1="431" y1="642" x2="581" y2="642"/>
  <circle class="char" cx="506" cy="642" r="7"/>
  <line class="ci-fox" x1="319" y1="670" x2="490" y2="670"/>
  <path class="fox" d="M405 661 l9 9 -9 9 -9 -9z"/>
  <text class="mono small" x="1070" y="647">-2.03 ± .28</text>
  <text class="mono small" x="1070" y="675">-2.41 ± .32</text>

  <circle class="char" cx="320" cy="748" r="6"/>
  <text class="blue small" x="334" y="753">character suite</text>
  <path class="fox" d="M470 741 l7 7 -7 7 -7 -7z"/>
  <text class="orange small" x="485" y="753">Fox suite</text>
  <text class="muted small" x="1050" y="753" text-anchor="end">Left is worse · zero is the complete O43 control</text>
</svg>
