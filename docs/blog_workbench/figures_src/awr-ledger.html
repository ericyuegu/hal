<figure class="breakout ledger-figure" id="awr-ledger">
 <div class="artifact interactive">
  <div class="figure-head"><div><h4>How later rewards change earlier weights</h4>
   <p>A short replay segment around a stock loss. These are illustrative, unnormalized weights with a substitute baseline. Training uses a learned value estimate and batch-normalized weights.</p>
  </div></div>
  <div class="ledger-controls">
   <div class="ledger-row ledger-knobs"><label><span>return half-life</span><input type="range" id="ledger-hl" min="0.5" max="20" step="0.5" value="8"><output id="ledger-hl-v"></output></label></div>
   <details class="figure-options"><summary>Game and weight settings</summary>
    <div class="ledger-row">
     <div class="segmented" id="ledger-games" aria-label="Game"></div>
     <div class="segmented" id="ledger-ego" aria-label="Ego port"><button type="button" data-ego="1" aria-pressed="true">port 1</button><button type="button" data-ego="2" aria-pressed="false">port 2</button></div>
     <div class="segmented" id="ledger-base" aria-label="Illustrative baseline"><button type="button" data-base="ema" aria-pressed="true">moving-average baseline</button><button type="button" data-base="mean" aria-pressed="false">game mean</button></div>
    </div>
    <div class="ledger-row ledger-knobs">
     <label><span>β</span><input type="range" id="ledger-beta" min="1.3" max="3" step="0.01" value="2.3"><output id="ledger-beta-v"></output></label>
     <label><span>weight cap</span><input type="range" id="ledger-cap" min="1" max="10" step="0.5" value="3.5"><output id="ledger-cap-v"></output></label>
     <label><input type="checkbox" id="ledger-full">Show the whole game</label>
     <button type="button" class="ledger-reset" id="ledger-reset">Reset reward parameters</button>
    </div>
   </details>
  </div>
  <p class="figure-note">Events: damage dealt ↑, damage taken ↓; stock lost by opponent ▲, by ego ▼. Dashed line: substitute baseline. Tap or point to read a frame.</p>
  <svg class="ledger-svg reflow-chart" id="ledger-svg" role="img" aria-label="Replay events, discounted return with illustrative baseline, and unnormalized illustrative weights."></svg>
  <div class="ledger-readout" id="ledger-readout" aria-live="polite"></div>
 </div>
</figure>
