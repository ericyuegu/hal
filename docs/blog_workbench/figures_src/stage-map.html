<figure class="breakout architecture-figure stagemap-figure" id="stage-map">
  <div class="artifact interactive">
    <div class="figure-head">
      <div>
        <h4>The five stages, on one time axis</h4>
        <p>Time runs left to right; the hierarchy runs down. The trunk reads the 128 frames it has seen; the decoder sits to the right of <em>now</em>, one step per predicted offset. Select a stage to inspect it.</p>
      </div>
    </div>
    <svg class="model-diagram stagemap-svg" id="stage-map-diagram" viewBox="0 0 992 606" role="img" aria-labelledby="stage-map-title stage-map-desc">
      <title id="stage-map-title">How the Melee policy turns 128 observed frames into future controller frames</title>
      <desc id="stage-map-desc">Time runs left to right. On the left, an observation encoder makes one token per observed frame and an eight-block causal trunk attends back over 128 of them, ending in one state for the current frame. That state passes to the right of the "now" line into a temporal decoder, whose ten steps sit at their true future offsets: a dense run at one to six frames ahead, then sparse steps at nine, twelve, sixteen and twenty. Below each step, a four-cell comb marks the four controller groups that step must choose. A detail band expands one step into that chain: C-stick, main stick, triggers, buttons, and then a fourteen-channel controller frame. A final band shows which predicted frames the runtime actually sends to the emulator.</desc>

        <marker id="sm-arrow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0.5 L10 5 L0 9.5 Z" class="sm-arrowhead"/></marker>
        <marker id="sm-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0.5 L10 5 L0 9.5 Z" class="sm-arrowhead accent"/></marker>
      </defs>

          <line x1="432" y1="134" x2="432" y2="212"/>
        </g>

        <line class="sm-now" x1="589" y1="44" x2="589" y2="340"/>
        <text class="sm-note" x="589" y="38" text-anchor="middle">now</text>
        <line class="sm-axis" x1="46" y1="320" x2="946" y2="320"/>
        <text class="sm-note" x="300" y="313" text-anchor="middle">← 128 frames the model has seen</text>
        <text class="sm-note" x="800" y="313" text-anchor="middle">20 frames the model predicts →</text>
        <g class="sm-axis">
          <line x1="60" y1="320" x2="60" y2="325"/><line x1="308" y1="320" x2="308" y2="325"/><line x1="556" y1="320" x2="556" y2="325"/>
          <line x1="619" y1="320" x2="619" y2="325"/><line x1="702" y1="320" x2="702" y2="325"/>

          <text x="619" y="336">t+1</text><text x="702" y="336">t+6</text><text x="801.6" y="336">t+12</text><text x="934.4" y="336">t+20</text>
        </g>
      </g>

          <circle cx="339" cy="212" r="2.6"/><circle cx="432" cy="212" r="2.6"/>
        </g>

        <g class="sm-block">
          <rect x="52" y="248" width="18" height="18"/><rect x="76" y="248" width="18" height="18"/>
          <rect x="100" y="248" width="18" height="18"/><rect x="124" y="248" width="18" height="18"/>
          <rect x="148" y="248" width="18" height="18"/><rect x="172" y="248" width="18" height="18"/>
          <rect x="196" y="248" width="18" height="18"/><rect x="220" y="248" width="18" height="18"/>
        </g>
        <text class="sm-note" x="248" y="256">the attention above runs once per block</text>
        <text class="sm-note" x="248" y="268">×8 · pre-norm · rotary · no bias</text>
        <text class="sm-note" x="52" y="290">every frame gets a state; only the state at t, hₜ, drives the plan</text>
      </g>

      <g class="sm-flow">

        <text class="sm-note" x="612" y="292">each step also picks four controller groups ↓</text>

      <!-- 04 group chain -->
